study:
  name: smic_xgboost_mae_optuna_v1

  # Task 1: Optimize point-forecast accuracy for one base stock.
  objective: mae
  direction: minimize

  # Start with 200 trials. Increase only after the pipeline is verified.
  n_trials: 200
  sampler_seed: 42

target:
  # Optuna evaluates only this stock's validation MAE.
  base_ticker: "0981.HK"

evaluation:
  # Optuna uses this period to score each trial.
  # Historical rows before each target week remain available for training.
  start: "2025-01-01"
  end: "2025-12-31"

training:
  # Minimum number of distinct historical target weeks required before fitting.
  minimum_training_weeks: 104

  # Base stock is always included automatically.
  # Optuna selects a subset of peer candidates for pooled row training.
  peer_candidates:
    - "0700.HK"
    - "1810.HK"
    - "9988.HK"
    - "3988.HK"
    - "1398.HK"
    - "0005.HK"
    - "1113.HK"
    - "0016.HK"
    - "0066.HK"

  # Total includes the base stock.
  min_total_tickers: 1
  max_total_tickers: 6

features:
  feature_set: weekly_v1
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  # Optuna selects a subset from this controlled candidate list.
  # Do not use all 44 features in the first tuning study.
  candidate_columns:
    - return_lag_1
    - return_lag_2
    - return_lag_4
    - return_lag_8
    - return_lag_12
    - rolling_mean_4
    - rolling_std_4
    - rolling_std_12
    - downside_deviation_12
    - risk_adjusted_mean_4
    - momentum_spread_4_12
    - market_return_lag_1
    - market_rolling_mean_4
    - market_rolling_mean_12
    - excess_return_lag_1
    - excess_return_lag_4
    - excess_return_lag_12
    - return_lag_1_cs_z
    - return_lag_4_cs_z
    - rolling_mean_4_cs_z
    - rolling_mean_12_cs_z
    - risk_adjusted_mean_4_cs_z

  min_features: 5
  max_features: 15

search_space:
  n_estimators:
    low: 40
    high: 120
    step: 10

  max_depth:
    low: 2
    high: 4

  learning_rate:
    low: 0.005
    high: 0.04
    log: true

  subsample:
    low: 0.6
    high: 0.9

  colsample_bytree:
    low: 0.6
    high: 0.9

  reg_alpha:
    low: 0.001
    high: 0.2
    log: true

  reg_lambda:
    low: 0.001
    high: 0.2
    log: true

  min_child_weight:
    low: 2
    high: 8

fixed_parameters:
  estimator: xgboost
  random_state: 42
  n_jobs: -1

output:
  run_id: smic_xgboost_mae_optuna_v1
  output_directory: outputs/tuning/smic_xgboost_mae_optuna_v1
  
  # Persistent Optuna study storage.
  storage_file: outputs/tuning/smic_xgboost_mae_optuna_v1/optuna_studies.db

  # false = fail if this study name already exists.
  # true = resume the same study if it already exists.
  load_if_exists: true

  # Per-trial CSV export.
  trials_csv: trials.csv

  # Best trial JSON export.
  best_trial_json: best_trial.json

  # Best model config YAML export.
  best_model_config_yaml: best_model_config.yaml

  # Tuning metadata JSON export.
  tuning_metadata_json: tuning_metadata.json