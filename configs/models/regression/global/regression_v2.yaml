model:
  name: general_regression
  label: Lasso Regression - Weekly V1 Selected Features
  version: "v2"
  run_id: regression_v2

parameters:
  estimator: lasso
  alpha: 0.001                       
  standardize: true
  polynomial_degree: 1
  fit_intercept: true
  max_iter: 10000

  minimum_training_weeks: 60

features:
  feature_set: weekly_v1
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  selected_columns:

    - market_return_lag_1
    - market_rolling_mean_4
    - market_rolling_mean_12


    - excess_return_lag_1
    - excess_return_lag_2
    - excess_return_lag_4
    - excess_return_lag_12
    - momentum_spread_4_12


    - rolling_std_4
    - downside_deviation_12


    - return_lag_1_cs_z
    - return_lag_4_cs_z
    - rolling_mean_4_cs_z
    - rolling_mean_12_cs_z
    - risk_adjusted_mean_4_cs_z
    - excess_return_lag_1_cs_z