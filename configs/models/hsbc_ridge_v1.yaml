model:
  name: general_regression
  label: HSBC Ridge Regression V1
  version: "v1"
  run_id: hsbc_ridge_v1

parameters:
  estimator: ridge
  alpha: 10.0
  standardize: true
  polynomial_degree: 1
  fit_intercept: true
  max_iter: 10000

  # This counts distinct historical target weeks, not individual stock rows.
  minimum_training_weeks: 60

training:
  # Fit this pooled regression using HSBC history only.
  tickers:
    - "0005.HK"

features:
  # Must match configs/features/weekly_v1.yaml
  feature_set: weekly_v1

  # This is the processed, point-in-time-safe training dataset.
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  # Model-specific feature selection.
  selected_columns:
    - return_lag_1
    - return_lag_4
    - rolling_mean_4
    - rolling_std_12
    - market_return_lag_1
    - market_rolling_mean_4
    - excess_return_lag_1
    - excess_return_lag_4
    - return_lag_1_cs_z