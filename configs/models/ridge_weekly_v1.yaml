model:
  name: general_regression
  label: Ridge Regression - Weekly V1 All Features
  version: "1.0"
  run_id: ridge_weekly_v1_all_features

parameters:
  estimator: ridge
  alpha: 10.0
  standardize: true
  polynomial_degree: 1
  fit_intercept: true

  # This counts distinct historical target weeks, not individual stock rows.
  # With 10 stocks, 60 weeks is approximately 600 panel observations.
  minimum_training_weeks: 60

features:
  # Must match configs/features/weekly_v1.yaml
  feature_set: weekly_v1

  # This is the processed, point-in-time-safe training dataset.
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  # Model-specific feature selection.
  # Ridge is intentionally configured with all 44 weekly_v1 features first.
  # Later, create another model YAML with a smaller selected_columns list
  # when comparing validation-backtest results.
  selected_columns:
    - return_lag_1
    - return_lag_2
    - return_lag_3
    - return_lag_4
    - return_lag_8
    - return_lag_12
    - return_lag_24
    - return_lag_52
    - rolling_mean_4
    - rolling_std_4
    - downside_deviation_4
    - risk_adjusted_mean_4
    - rolling_mean_12
    - rolling_std_12
    - downside_deviation_12
    - risk_adjusted_mean_12
    - rolling_mean_26
    - rolling_std_26
    - downside_deviation_26
    - risk_adjusted_mean_26
    - momentum_spread_4_12
    - market_return_lag_1
    - market_rolling_mean_4
    - market_rolling_mean_12
    - market_rolling_mean_26
    - excess_return_lag_1
    - excess_return_lag_2
    - excess_return_lag_3
    - excess_return_lag_4
    - excess_return_lag_8
    - excess_return_lag_12
    - excess_return_lag_24
    - excess_return_lag_52
    - excess_rolling_mean_4
    - excess_rolling_mean_12
    - excess_rolling_mean_26
    - return_lag_1_cs_z
    - return_lag_4_cs_z
    - return_lag_12_cs_z
    - rolling_mean_4_cs_z
    - rolling_mean_12_cs_z
    - rolling_mean_26_cs_z
    - risk_adjusted_mean_4_cs_z
    - excess_return_lag_1_cs_z