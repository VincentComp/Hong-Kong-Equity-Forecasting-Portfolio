model:
  name: tree_boosting
  label: Banks XGBoost V1
  version: "v1"
  run_id: banks_xgboost_v1

parameters:
  estimator: xgboost

  n_estimators: 80
  max_depth: 2
  learning_rate: 0.01
  subsample: 0.8
  colsample_bytree: 0.8

  reg_alpha: 0.015
  reg_lambda: 0.035

  min_child_weight: 5

  random_state: 42
  n_jobs: -1

  minimum_training_weeks: 104

training:
  # Historical rows used to fit one pooled XGBoost model.
  # This does not decide final portfolio assignment.
  tickers:
    - "3988.HK"
    - "1398.HK"

features:
  feature_set: weekly_v1
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  selected_columns:
    - return_lag_1
    - return_lag_4
    - rolling_mean_4
    - rolling_std_4
    - downside_deviation_12
    - market_return_lag_1
    - market_rolling_mean_4
    - excess_return_lag_1
    - excess_return_lag_4
    - return_lag_1_cs_z