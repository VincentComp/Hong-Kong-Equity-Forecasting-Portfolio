model:
  name: tree_boosting
  label: Temp v1
  version: "v1"
  run_id: Temp_v1

parameters:
  estimator: xgboost

  n_estimators: 120
  max_depth: 4
  learning_rate: 0.0077
  subsample: 0.89
  colsample_bytree: 0.77

  reg_alpha: 0.0149
  reg_lambda: 0.1601

  min_child_weight: 4
  random_state: 42
  n_jobs: -1

  minimum_training_weeks: 104

training:
  tickers:
    - "0981.HK" 
    - "1113.HK"
    - "0016.HK"

features:
  feature_set: weekly_v1
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  selected_columns:
    -  return_lag_12
    -  return_lag_24
    -  downside_deviation_4
    -  risk_adjusted_mean_4
    -  rolling_std_12
    -  downside_deviation_12
    -  risk_adjusted_mean_12
    -  rolling_mean_26
    -  rolling_std_26
    -  market_return_lag_1
    -  market_rolling_mean_4
    -  market_rolling_mean_12
    -  excess_return_lag_2
    -  excess_return_lag_3
    -  excess_return_lag_12
    -  excess_rolling_mean_12
    -  excess_rolling_mean_26
    -  rolling_mean_26_cs_z
    -  risk_adjusted_mean_4_cs_z