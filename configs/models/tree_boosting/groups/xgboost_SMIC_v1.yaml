model:
  name: tree_boosting
  label: XGBoost SMIC v1
  version: "v1"
  run_id: xgboost_SMIC_v1

parameters:
  estimator: xgboost

  n_estimators: 80
  max_depth: 4
  learning_rate: 0.0282
  subsample: 0.88
  colsample_bytree: 0.63

  reg_alpha: 0.0010
  reg_lambda: 0.1250

  min_child_weight: 5
  random_state: 42
  n_jobs: -1

  minimum_training_weeks: 104

training:
  tickers:
    - "0981.HK" 
    - "0700.HK"
    - "9988.HK"
    - "3988.HK"
    - "1113.HK"
    - "0016.HK"
    - "0066.HK"

features:
  feature_set: weekly_v1
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  selected_columns:







    - return_lag_4
    - return_lag_8
    - return_lag_12
    - return_lag_24
    - rolling_mean_4
    - downside_deviation_4
    - risk_adjusted_mean_4
    - rolling_mean_26
    - rolling_std_26
    - downside_deviation_26
    - risk_adjusted_mean_26
    - momentum_spread_4_12
    - market_rolling_mean_12
    - excess_return_lag_2
    - excess_return_lag_3
    - excess_return_lag_4
    - excess_return_lag_8
    - excess_return_lag_24
    - return_lag_1_cs_z
    - excess_return_lag_1_cs_z