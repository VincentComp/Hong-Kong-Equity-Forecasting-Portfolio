model:
  name: tree_boosting
  label: XGBoost V1
  version: "v1"
  run_id: xgboost_v1

parameters:
  estimator: xgboost

  n_estimators: 60
  max_depth: 2
  learning_rate: 0.0121
  subsample: 0.8
  colsample_bytree: 0.89

  reg_alpha: 0.0340
  reg_lambda: 0.0286

  min_child_weight: 2
  random_state: 42
  n_jobs: -1

  minimum_training_weeks: 104

features:
  feature_set: weekly_v1
  feature_map_path: data/processed/weekly_features_weekly_v1.csv

  selected_columns:
    - return_lag_12
    - return_lag_24
    - risk_adjusted_mean_4
    - risk_adjusted_mean_12
    - rolling_mean_26
    - rolling_std_26
    - risk_adjusted_mean_26
    - momentum_spread_4_12
    - market_rolling_mean_4
    - excess_return_lag_1
    - excess_return_lag_3
    - excess_return_lag_8
    - excess_return_lag_24
    - return_lag_1_cs_z
    - return_lag_12_cs_z
    - risk_adjusted_mean_4_cs_z