model:
  name: portfolio_router
  label: Portfolio Router V1
  version: "v1"
  run_id: portfolio_router_v1

# Each profile points to one normal model YAML.
# The router will run each unique profile once and select
# its prediction only for the tickers assigned below.
profiles:
  selected_ridge:
    config_path: configs/models/regression/global/regression_v2.yaml

  default_ewma:
    config_path: configs/models/universal/ewma_span4_v1.yaml

  SMIC_xgboost:
    config_path: configs/models/tree_boosting/groups/xgboost_SMIC_v1.yaml

# Every portfolio ticker in base.yaml must appear exactly once.
# ^HSI must never appear here because it is a benchmark only.
assignments:
  "0005.HK": selected_ridge

  "3988.HK": SMIC_xgboost
  "1398.HK": SMIC_xgboost

  "1113.HK": default_ewma
  "0066.HK": default_ewma
  "0700.HK": default_ewma
  "0016.HK": default_ewma
  "1810.HK": default_ewma
  "9988.HK": selected_ridge
  "0981.HK": selected_ridge